<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yo Music — Explorar</title>
    <link
      rel="shortcut icon"
      href="imagens/faviconYoMusic.png"
      type="image/x-icon" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet" />
    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg">
      <div class="container">
        <a class="site-logo" href="index.html">
          <img
            src="imagens/logomarcaYoMusic.png"
            alt="Yo Music"
            style="width: auto; height: 70px; object-fit: contain" />
        </a>
        <button
          class="navbar-toggler border-0"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#nav">
          <i class="bi bi-list fs-4" style="color: var(--text)"></i>
        </button>
        <div class="collapse navbar-collapse" id="nav">
          <ul class="navbar-nav mx-auto gap-1 my-2 my-lg-0">
            <li class="nav-item">
              <a class="nav-link" href="index.html">home</a>
              <a class="nav-link" href="perfil.html">meu perfil</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="explorar.html">explorar</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="perfil.html">listas</a>
            </li>
          </ul>
          <div class="d-flex gap-2 align-items-center mt-2 mt-lg-0">
            <div style="margin-right: 8px">
              <button id="theme-toggle" onclick="toggleTheme()">
                <span id="toggle-label">◐ escuro</span>
              </button>
            </div>
            <div
              class="profile-init"
              style="width: 36px; height: 36px; font-size: 14px">
              AR
            </div>
          </div>
        </div>
      </div>
    </nav>

    <div class="container my-5" id="genreView">
      <div class="section-head mb-4">
        <span>// explorar por gênero</span>
      </div>
      <div
        class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-5 g-3"
        id="genreCardsGrid"></div>
    </div>

    <div class="container my-5 genre-detail" id="genreDetail">
      <a href="explorar.html" class="back-link">← todos os gêneros</a>
      <div class="section-head mb-4">
        <span id="genreDetailTitle">// gênero</span>
        <span
          id="genreDetailCount"
          style="
            font-size: 12px;
            color: var(--text-faint);
            font-family: &quot;Courier Prime&quot;, monospace;
          "></span>
      </div>
      <div
        class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-5 g-3"
        id="genreAlbumsGrid"></div>
    </div>

    <footer>
      <div
        class="container d-flex justify-content-between align-items-center flex-wrap gap-2">
        <span>
          <span
            style="
              background: var(--text);
              color: var(--accent);
              padding: 1px 6px;
              font-weight: 700;
            "
            >YO</span
          >
          MUSIC — projeto crud
        </span>
        <a href="index.html" class="back-link" style="margin: 0"
          >← voltar ao início</a
        >
      </div>
    </footer>

    <div class="toast-msg" id="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="crud.js"></script>
  </body>
</html>
