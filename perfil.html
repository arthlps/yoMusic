<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yo Music — Perfil</title>
    <link rel="shortcut icon" href="imagens/faviconYoMusic.png" type="image/x-icon" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet" />
    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg">
      <div class="container">
       
        <a class="site-logo" href="index.html">
          <span style="background:var(--text);color:var(--accent);padding:1px 6px;font-weight:700">YO</span>
          MUSIC 
        </span>
        </a>
        <button
          class="navbar-toggler border-0"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#nav">
          <i class="bi bi-list fs-4" style="color: var(--text)"></i>
        </button>
        <div class="collapse navbar-collapse" id="nav">
          <ul class="navbar-nav mx-auto gap-1 my-2 my-lg-0">
            <li class="nav-item">
              <a class="nav-link" href="index.html">home</a>
            </li>
            <!-- <li class="nav-item">
              <a class="nav-link" href="explorar.html">explorar</a>
            </li>
            <li class="nav-item"><a class="nav-link" href="#">reviews</a></li>
            <li class="nav-item">
              <a class="nav-link active" href="perfil.html">listas</a> -->
            </li>
          </ul>
          <div class="d-flex gap-2 align-items-center mt-2 mt-lg-0">
            <div style="margin-right: 8px">
              <button id="theme-toggle" onclick="toggleTheme()">
                <span id="toggle-label">◐ escuro</span>
              </button>
            </div>
            <div
              class="profile-init"
              style="width: 36px; height: 36px; font-size: 14px">
              AR
            </div>
          </div>
        </div>
      </div>
    </nav>

   
    <section class="profile-hero">
      <div class="container">
        <div class="d-flex align-items-center gap-4 flex-wrap">
          <div class="profile-avatar-big" id="profileAvatarBig">AR</div>
          <div>
            <div
              style="
                font-family: &quot;Courier Prime&quot;, monospace;
                font-size: 11px;
                color: var(--text-faint);
                margin-bottom: 4px;
              ">
              // perfil
            </div>
            <div
              style="
                font-family: &quot;Courier Prime&quot;, monospace;
                font-weight: 700;
                font-size: 28px;
                color: var(--text);
              ">
              arthur
            </div>
            <div
              style="
                font-size: 12px;
                color: var(--text-muted);
                font-family: &quot;Courier Prime&quot;, monospace;
              ">
            
            </div>
          </div>
          <div class="d-flex gap-4 ms-auto flex-wrap">
            <div class="text-center">
              <div class="stat-big" id="statReviews">0</div>
              <div class="stat-big-label">reviews</div>
            </div>
            <div class="text-center">
              <div class="stat-big" id="statWishlist">0</div>
              <div class="stat-big-label">wishlist</div>
            </div>
            <div class="text-center">
              <div class="stat-big" id="statLiked">0</div>
              <div class="stat-big-label">curtidos</div>
            </div>
          </div>
        </div>
      </div>
    </section>

   
    <div class="container my-5">
      <div class="row g-4">
      
        <div class="col-lg-7">
          <div class="section-head mb-3">
            <span>// minhas reviews</span>
          </div>
          <div id="profileReviews">
            <div class="empty-state">você ainda não avaliou nenhum álbum.</div>
          </div>
        </div>

     
        <div class="col-lg-5">
          <div class="section-head mb-3">
            <span>// quero ouvir</span>
            <span
              id="wishlistCountLabel"
              style="
                font-size: 12px;
                color: var(--text-faint);
                font-family: &quot;Courier Prime&quot;, monospace;
              "></span>
          </div>
          <div class="sidebar-box mb-4">
            <div class="sidebar-body" id="profileWishlist">
              <div class="empty-state">sua lista está vazia.</div>
            </div>
          </div>

          <div class="section-head mb-3">
            <span>// álbuns curtidos</span>
            <span
              id="likedCountLabel"
              style="
                font-size: 12px;
                color: var(--text-faint);
                font-family: &quot;Courier Prime&quot;, monospace;
              "></span>
          </div>
          <div class="sidebar-box">
            <div class="sidebar-body" id="profileLiked">
              <div class="empty-state">você ainda não curtiu nenhum álbum.</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <footer style="margin-top:280px;">
      <div
        class="container d-flex justify-content-between align-items-center flex-wrap gap-2">
        <span>
          <span
            style="
              background: var(--text);
              color: var(--accent);
              padding: 1px 6px;
              font-weight: 700;
            "
            >YO</span
          >
          MUSIC — projeto crud
        </span>
        <a href="index.html" class="back-link" style="margin: 0"
          >← voltar ao início</a
        >
      </div>
    </footer>

    <div class="toast-msg" id="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="crud.js"></script>
    <script src="script.js"></script>
  </body>
</html>
